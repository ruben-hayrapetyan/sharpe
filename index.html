<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharpe</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%220%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%2317a06f%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%230b6e4c%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2224%22%20fill=%22url%28%23g%29%22/%3E%3Cpolygon%20points=%2257.0,27.0%2018.4,40.5%2058.4,58.5%2017.0,73.0%2043.0,73.0%2081.6,59.5%2041.6,41.5%2083.0,27.0%22%20fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var s = JSON.parse(localStorage.getItem('greenbook-drill.v1') || '{}');
    if (s.settings && s.settings.theme) document.documentElement.dataset.theme = s.settings.theme;
  } catch (e) {}
</script>
</head>
<body>
<header class="bar">
  <button class="brand" data-action="home" aria-label="Sharpe home">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="var(--accent)"/><polygon points="57.0,27.0 18.4,40.5 58.4,58.5 17.0,73.0 43.0,73.0 81.6,59.5 41.6,41.5 83.0,27.0" fill="var(--accent-ink)"/></svg>
    <span class="brand-name">Sharpe</span>
  </button>
  <div class="bar-tools">
    <button class="btn ask" id="askbtn" data-action="chat-toggle" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>Ask Claude <kbd>⌘K</kbd></button>
    <div class="stepper" role="group" aria-label="Question size">
      <button data-action="scale-down" aria-label="Smaller" title="Smaller ( - )">A<sub>−</sub></button>
      <button data-action="scale-up" aria-label="Larger" title="Larger ( + )">A<sup>+</sup></button>
    </div>
    <button class="icon-btn" data-action="theme" aria-label="Toggle theme" title="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite"></div>

<aside id="chat" aria-label="Ask Claude" hidden>
  <div class="chat-head">
    <div class="chat-titles"><div class="chat-title">Ask Claude</div><div class="chat-ctx" id="chatctx"></div></div>
    <div class="chat-tools"><button class="btn ghost sm" data-action="chat-clear">Clear</button><button class="icon-btn" data-action="chat-close" aria-label="Close panel">✕</button></div>
  </div>
  <div class="chat-log" id="chatlog" aria-live="polite"></div>
  <div class="chat-sees" id="chatsees"></div>
  <form class="chat-form" id="chatform">
    <textarea id="chatin" rows="1" placeholder="Ask about this problem…" aria-label="Message"></textarea>
    <button class="btn primary" id="chatsend" type="submit">Send</button>
    <button class="btn" id="chatstop" type="button" data-action="chat-stop" hidden>Stop</button>
  </form>
</aside>

<dialog id="review" aria-label="Review question"></dialog>

<script src="data.js"></script>
<script src="fermi.js"></script>
<script src="app.js"></script>
</body>
</html>
